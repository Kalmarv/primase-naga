[package]
name = "primase-naga"
version = "30.0.1"
authors = ["gfx-rs developers"]
edition = "2021"
rust-version = "1.87"
description = "naga 30.0.1 (the wgpu project's shader translator and validator) with three additions: WGSL output of ray queries, an optional result for ImageAtomic, and Exchange on 32-bit images"
repository = "https://github.com/Kalmarv/primase-naga"
homepage = "https://wgpu.rs/"
keywords = ["shader", "SPIR-V", "GLSL", "MSL", "naga"]
license = "MIT OR Apache-2.0"
readme = "README.md"
exclude = ["Cargo.lock", "target/**/*"]

[lib]
name = "naga"

[package.metadata.docs.rs]
all-features = true

[features]
default = []
dot-out = []
glsl-in = ["dep:pp-rs"]
glsl-out = []

## Enables outputting to the Metal Shading Language (MSL).
##
## This enables MSL output regardless of the target platform.
## If you want to enable it only when targeting iOS/tvOS/watchOS/macOS, use `naga/msl-out-if-target-apple`.
msl-out = []

## Enables outputting to the Metal Shading Language (MSL) only if the target platform is iOS/tvOS/watchOS/macOS.
##
## If you want to enable MSL output it regardless of the target platform, use `naga/msl-out`.
msl-out-if-target-apple = []

serialize = [
    "dep:serde",
    "bitflags/serde",
    "half/serde",
    "hashbrown/serde",
    "naga-types/serialize",
]
deserialize = [
    "dep:serde",
    "bitflags/serde",
    "half/serde",
    "hashbrown/serde",
    "naga-types/deserialize",
]
arbitrary = [
    "dep:arbitrary",
    "bitflags/arbitrary",
    "half/arbitrary",
    "half/std",
    "naga-types/arbitrary",
]
spv-in = ["dep:petgraph", "petgraph/graphmap", "dep:spirv"]
spv-out = ["dep:spirv"]
wgsl-in = ["dep:unicode-ident"]
wgsl-out = []

## Enables outputting to HLSL (Microsoft's High-Level Shader Language).
##
## This enables HLSL output regardless of the target platform.
## If you want to enable it only when targeting Windows, use `hlsl-out-if-target-windows`.
hlsl-out = []

## Enables outputting to HLSL (Microsoft's High-Level Shader Language) only if the target platform is Windows.
##
## If you want to enable HLSL output it regardless of the target platform, use `naga/hlsl-out`.
hlsl-out-if-target-windows = []

## Enables colored output through codespan-reporting and termcolor.
termcolor = ["codespan-reporting/termcolor"]

## Enables writing output to stderr.
stderr = ["codespan-reporting/std"]

## Enables integration with the underlying filesystem.
fs = []

[dependencies]
naga-types = { version = "30.0.0" }
arbitrary = { version = "1.4.2", features = ["derive"], optional = true }
arrayvec = { version = "0.7.1", default-features = false }
bitflags = "2.9"
bit-set = { version = "0.10", default-features = false }
cfg-if = "1"
codespan-reporting = { version = "0.13", default-features = false }
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher", "inline-more"] }
half = { version = "2.5", default-features = false, features = ["num-traits"] }
indexmap = { version = "2.11.4", default-features = false }
rustc-hash = { version = "1.1", default-features = false }
libm = { version = "0.2.6", default-features = false }
log = "0.4.29"
num-traits = { version = "0.2.16", default-features = false }
once_cell = { version = "1.21", default-features = false, features = ["alloc", "race"] }
spirv = { version = "0.4", optional = true }
thiserror = { version = "2.0.12", default-features = false }
serde = { version = "1.0.225", default-features = false, features = ["alloc", "derive"], optional = true }
petgraph = { version = "0.8", default-features = false, optional = true }
pp-rs = { version = "0.2.1", optional = true }
unicode-ident = { version = "1.0.5", optional = true }

[build-dependencies]
cfg_aliases = "0.2.2"


[dev-dependencies]
bytemuck = { version = "1.22", features = ["extern_crate_alloc", "min_const_generics"] }
diff = "0.1"
env_logger = { version = "0.11", default-features = false }
itertools = { version = "0.14" }
ron = "0.12"
rspirv = "0.13"
spirv = "0.4"
strum = { version = "0.28", default-features = false, features = ["derive"] }
walkdir = "2.3"
serde = { version = "1.0.225", features = ["default", "derive"] }
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher", "inline-more", "serde"] }

[lints.rust]
missing_debug_implementations = "warn"

[lints.clippy]
std_instead_of_alloc = "warn"
std_instead_of_core = "warn"
alloc_instead_of_core = "warn"
